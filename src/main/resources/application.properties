spring.application.name=api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Google Cloud Console OAuth 2.0 Web client ID
# The development defaults let the application boot before OAuth credentials are issued.
# Set both environment variables before testing a real Google login.
google.oauth.client-id=${GOOGLE_CLIENT_ID:google-client-id-not-configured}
jwt.secret=${JWT_SECRET:novforge-local-development-secret-key-change-me}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600}
admin.emails=${ADMIN_EMAILS:}

supabase.url=${SUPABASE_URL:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.profile-bucket=${SUPABASE_PROFILE_BUCKET:profiles}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
